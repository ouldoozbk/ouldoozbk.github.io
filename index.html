<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 1. The HTML Meta Redirect (trigger in 0 seconds) -->
    <meta http-equiv="refresh" content="0;url=https://ouldooz.com">
    <title>Page Redirection</title>
    
    <!-- 2. The JavaScript Fallback -->
    <script type="text/javascript">
        window.location.replace("https://ouldooz.com");
    </script>
</head>
<body>
    <!-- 3. The Manual Fallback  -->
    <p>If you are not redirected automatically, please follow this
       <a href="https://ouldooz.com"> Link</a>.
    </p>
</body>
</html>
